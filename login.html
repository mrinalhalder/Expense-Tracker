<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Income Setup | Expense Tracker</title>
      <link rel="stylesheet" href="loginStyle.css" />
   </head>

   <body>
      <main class="page-container">
         <section class="form-card">
            <div class="brand">
               <span class="brand-icon">₹</span>
               <span>Expense<span class="accent">Tracker</span></span>
            </div>

            <div class="form-header">
               <div class="welcome-icon">✦</div>
               <p class="eyebrow">LET'S GET STARTED</p>
               <h1>Set up your profile</h1>
               <p class="subtitle">
                  Tell us a little about yourself to start tracking your
                  finances.
               </p>
            </div>

            <form id="income-form">
               <div class="input-group">
                  <label for="name">Name</label>
                  <div class="input-wrapper">
                     <span class="input-icon" aria-hidden="true">♙</span>
                     <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                     />
                  </div>
               </div>

               <div class="input-group">
                  <label for="income">Monthly Income</label>
                  <div class="input-wrapper">
                     <span class="currency-symbol" aria-hidden="true">₹</span>
                     <input
                        type="number"
                        id="income"
                        name="income"
                        placeholder="e.g. 25000"
                        min="0"
                        step="0.01"
                        required
                     />
                  </div>
                  <p class="field-hint">
                     Enter your total monthly income in INR.
                  </p>
               </div>

               <button type="submit" class="submit-btn">
                  Continue <span aria-hidden="true">→</span>
               </button>
            </form>

            <div class="privacy-note">
               <span aria-hidden="true">⌑</span>
               Your financial journey starts here.
            </div>
         </section>

         <p class="page-footer">Manage your money. Build better habits.</p>
      </main>

      <script type="module" src="./varification.js"></script>
      <script type="module" src="./login.js"></script>
   </body>
</html>
